services:
  ui:
    build: .
    image: slskprime-ui:0.3.1
    network_mode: none
    restart: "no"
    volumes:
      - ui:/out

  backend:
    # Official, unmodified backend; slskprime distributes only the web frontend.
    image: slskd/slskd@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      ui:
        condition: service_completed_successfully
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5030}:5030"
      - "${SOULSEEK_PORT:-50300}:${SOULSEEK_PORT:-50300}"
    environment:
      SLSKD_USERNAME: "${WEB_USERNAME:?Set WEB_USERNAME in .env}"
      SLSKD_PASSWORD: "${WEB_PASSWORD:?Set a strong WEB_PASSWORD in .env}"
      SLSKD_CONTENT_PATH: ../ui
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_REMOTE_FILE_MANAGEMENT: "false"
      SLSKD_DOWNLOADS_DIR: /downloads
      SLSKD_INCOMPLETE_DIR: /incomplete
      SLSKD_SLSK_LISTEN_PORT: "${SOULSEEK_PORT:-50300}"
    volumes:
      - ./appdata:/app
      - ./downloads/complete:/downloads
      - ./downloads/incomplete:/incomplete
      - "${MEDIA_PATH:?Set the verified absolute MEDIA_PATH in .env}:/media:ro"
      - ui:/ui:ro

volumes:
  ui:
