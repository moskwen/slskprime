name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm exec semantic-ui-css-patch
        working-directory: web
      - run: pnpm exec craco test --watchAll=false --runInBand --runTestsByPath src/lib/appearance.test.js src/lib/studio.test.js src/lib/installationContacts.test.js src/components/StudioFavorites.test.jsx src/components/Search/Response.studio.test.jsx src/components/Transfers/TransferList.studio.test.jsx
        working-directory: web
        env:
          CI: "true"
      - run: pnpm run build
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: "true"
          GENERATE_SOURCEMAP: "false"
      - run: cp LICENSE NOTICE web/build/ && cp -R third-party-licenses web/build/ && tar -czf slskprime-ui.tar.gz -C web/build . && sha256sum slskprime-ui.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: slskprime-ui
          path: |
            slskprime-ui.tar.gz
            SHA256SUMS
